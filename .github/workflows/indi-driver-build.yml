name: INDI Driver Build

on:
  push:
    paths:
      - 'drivers/indi/**'
      - '.github/workflows/indi-driver-build.yml'
  pull_request:
    paths:
      - 'drivers/indi/**'
      - '.github/workflows/indi-driver-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: drivers/indi

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:mutlaqja/ppa
          sudo apt-get update
          sudo apt-get install -y cmake g++ make libindi-dev libnova-dev libgsl-dev zlib1g-dev

      - name: Print build environment
        run: |
          cmake --version
          g++ --version | head -n 1
          dpkg -s libindi-dev libnova-dev libgsl-dev zlib1g-dev | grep -E '^(Package|Version):'

      - name: Fetch INDI CMake modules
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/indilib/indi.git /tmp/indi-upstream
          cd /tmp/indi-upstream
          git sparse-checkout set cmake_modules
          cp cmake_modules/CMakeCommon.cmake "$GITHUB_WORKSPACE/drivers/indi/cmake_modules/"
          cp cmake_modules/FindINDI.cmake "$GITHUB_WORKSPACE/drivers/indi/cmake_modules/"
          cp cmake_modules/FindNova.cmake "$GITHUB_WORKSPACE/drivers/indi/cmake_modules/"
          cp cmake_modules/UnityBuild.cmake "$GITHUB_WORKSPACE/drivers/indi/cmake_modules/"

      - name: Configure
        run: cmake -S . -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --parallel

      - name: Install to staging
        run: |
          DESTDIR="$RUNNER_TEMP/indi-stage" cmake --install build --prefix /usr --config Debug
          test -f "$RUNNER_TEMP/indi-stage/usr/bin/indi_opensmartfocuser_focuser"
          test -f "$RUNNER_TEMP/indi-stage/usr/share/indi/indi_opensmartfocuser_focuser.xml"