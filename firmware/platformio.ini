; OpenSmartFocuser — PlatformIO Configuration
; https://docs.platformio.org/page/projectconf.html

[env:esp32s3]
; Build target and framework configuration for ESP32-S3 firmware.
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.usb_mode = 0
board_build.arduino.cdc_on_boot = 1
board_build.vid = 0x1209
board_build.pid = 0xF0C1
board_build.usb_manufacturer = JayTek
board_build.usb_product = OpenSmartFocuser

; Serial monitor speed for runtime logs.
monitor_speed = 115200
monitor_filters = send_on_enter
monitor_echo = yes
monitor_eol = CRLF
;monitor_port = COM5

;upload_port = COM6
;upload_speed = 2000000     

;debug_tool = esp-builtin
;debug_init_break = break setup

;build_type = debug

; Core runtime libraries: display, motion planning, and TMC2209 control.
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    gin66/FastAccelStepper
    teemuatlut/TMCStepper @ ^0.7.3
    the-young-maker/OpenMenuOS
    madhephaestus/ESP32Servo @ ^3.0.8
    ArminJo/ServoEasing @ ^3.2.0

; Compile-time defines and TFT_eSPI setup injection.
build_unflags =
    -D ARDUINO_USB_MODE=1

build_flags =
    -D VERSION=\"0.1.0\"
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D SMOOTH_FONT
    -D USER_SETUP_LOADED=1
    -include include/TFT_eSPI_Setup.h
